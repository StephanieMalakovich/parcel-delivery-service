spring:
  application:
    name: main-service

  datasource:
    url: ${PRIMARY_DB_URL:jdbc:postgresql://localhost:5432/primarydb}
    username: ${PRIMARY_DB_USER:postgres}
    password: ${PRIMARY_DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    contexts: ${LIQUIBASE_CONTEXTS:}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/parcel}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/parcel/protocol/openid-connect/certs}

app:
  security:
    user-id-claim: ${USER_ID_CLAIM:user_id}

logging:
  level:
    liquibase: INFO
