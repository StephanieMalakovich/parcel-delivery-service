  - changeSet:
      id: 002-demo-courier-zones
      author: delivery
      context: demo
      changes:
        - sql:
            sql: |
              INSERT INTO courier_zones (courier_id, zone_id)
              SELECT c.id, z.id
              FROM couriers c
              JOIN zones z ON z.name IN ('Центральный', 'Советский')
              WHERE c.user_id = 2001;

              INSERT INTO courier_zones (courier_id, zone_id)
              SELECT c.id, z.id
              FROM couriers c
              JOIN zones z ON z.name = 'Первомайский'
              WHERE c.user_id = 2002;

              INSERT INTO courier_zones (courier_id, zone_id)
              SELECT c.id, z.id
              FROM couriers c
              JOIN zones z ON z.name = 'Центральный'
              WHERE c.user_id = 2003;

  - changeSet:
      id: 002-demo-orders
      author: delivery
      context: demo
      changes:
        - sql:
            sql: |
              -- #1 DELIVERED (10 дней назад), клиент 1001, курьер 2001, зона Центральный
              INSERT INTO orders (client_id, courier_id, zone_id, pickup_address,
                                  delivery_address, status,
                                  created_at, assigned_at, picked_up_at, delivered_at)
              SELECT c.id, co.id, z.id, 'ул. Ленина 1', 'ул. Мира 10',
                     'DELIVERED',
                     now() - interval '10 days',
                     now() - interval '10 days' + interval '10 min',
                     now() - interval '10 days' + interval '30 min',
                     now() - interval '10 days' + interval '1 hour'
              FROM clients c, couriers co, zones z
              WHERE c.user_id = 1001 AND co.user_id = 2001
                AND z.name = 'Центральный';

              INSERT INTO parcels (order_id, weight_kg, size, description)
              SELECT o.id, 2.50, 'SMALL', 'Документы'
              FROM orders o
              WHERE o.pickup_address = 'ул. Ленина 1'
                AND o.delivery_address = 'ул. Мира 10';

              -- #2 CANCELLED клиентом (2 дня назад), клиент 1002, без курьера, зона Советский
              INSERT INTO orders (client_id, courier_id, zone_id, pickup_address,
                                  delivery_address, status, cancelled_by,
                                  created_at, cancelled_at)
              SELECT c.id, NULL, z.id, 'пр. Победы 5', 'ул. Гагарина 20',
                     'CANCELLED', 'CLIENT',
                     now() - interval '2 days',
                     now() - interval '2 days' + interval '5 min'
              FROM clients c, zones z
              WHERE c.user_id = 1002 AND z.name = 'Советский';

              INSERT INTO parcels (order_id, weight_kg, size, description)
              SELECT o.id, 1.20, 'SMALL', 'Книги'
              FROM orders o
              WHERE o.pickup_address = 'пр. Победы 5';

              -- #3 SEARCHING_COURIER (30 минут назад), клиент 1001, зона Советский
              INSERT INTO orders (client_id, courier_id, zone_id, pickup_address,
                                  delivery_address, status, created_at)
              SELECT c.id, NULL, z.id, 'ул. Садовая 12', 'ул. Кирова 8',
                     'SEARCHING_COURIER', now() - interval '30 min'
              FROM clients c, zones z
              WHERE c.user_id = 1001 AND z.name = 'Советский';

              INSERT INTO parcels (order_id, weight_kg, size, description)
              SELECT o.id, 3.00, 'MEDIUM', 'Одежда'
              FROM orders o
              WHERE o.pickup_address = 'ул. Садовая 12';

              -- #4 COURIER_ASSIGNED (50 минут назад), клиент 1002, курьер 2002, зона Первомайский
              INSERT INTO orders (client_id, courier_id, zone_id, pickup_address,
                                  delivery_address, status,
                                  created_at, assigned_at)
              SELECT c.id, co.id, z.id, 'ул. Строителей 3', 'ул. Победы 45',
                     'COURIER_ASSIGNED',
                     now() - interval '1 hour',
                     now() - interval '50 min'
              FROM clients c, couriers co, zones z
              WHERE c.user_id = 1002 AND co.user_id = 2002
                AND z.name = 'Первомайский';

              INSERT INTO parcels (order_id, weight_kg, size, description)
              SELECT o.id, 5.00, 'LARGE', 'Бытовая техника'
              FROM orders o
              WHERE o.pickup_address = 'ул. Строителей 3';

              -- #5 PICKED_UP (20 минут назад), клиент 1001, курьер 2001, зона Центральный
              INSERT INTO orders (client_id, courier_id, zone_id, pickup_address,
                                  delivery_address, status,
                                  created_at, assigned_at, picked_up_at)
              SELECT c.id, co.id, z.id, 'ул. Пушкина 15', 'ул. Чехова 3',
                     'PICKED_UP',
                     now() - interval '1 hour',
                     now() - interval '40 min',
                     now() - interval '20 min'
              FROM clients c, couriers co, zones z
              WHERE c.user_id = 1001 AND co.user_id = 2001
                AND z.name = 'Центральный';

              INSERT INTO parcels (order_id, weight_kg, size, description)
              SELECT o.id, 0.80, 'SMALL', 'Косметика'
              FROM orders o
              WHERE o.pickup_address = 'ул. Пушкина 15';

              -- курьеры с активными заказами становятся BUSY
              UPDATE couriers SET status = 'BUSY'
              WHERE id IN (
                SELECT DISTINCT courier_id FROM orders
                WHERE courier_id IS NOT NULL
                  AND status IN ('COURIER_ASSIGNED', 'PICKED_UP')
              );

  - changeSet:
      id: 002-demo-reviews
      author: delivery
      context: demo
      changes:
        - sql:
            sql: |
              INSERT INTO reviews (order_id, courier_id, rating, comment, created_at)
              SELECT o.id, o.courier_id, 5, 'Быстро и вежливо',
                     o.delivered_at + interval '2 hours'
              FROM orders o
              WHERE o.pickup_address = 'ул. Ленина 1'
                AND o.delivery_address = 'ул. Мира 10';

