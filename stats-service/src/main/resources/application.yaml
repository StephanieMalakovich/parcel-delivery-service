spring:
  application:
    name: stats-service
  datasource:
    url: ${STATS_DB_URL:jdbc:postgresql://localhost:5434/statsdb}
    username: ${STATS_DB_USER:postgres}
    password: ${STATS_DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  grpc:
    server:
      port: ${GRPC_PORT:9091}
stats:
  rating-maturity: 7d
  time-zone: ${STATS_TIME_ZONE:}
logging:
  level:
    liquibase: INFO
